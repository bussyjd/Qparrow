plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.jlink' version '4.0.2'
    id 'org.gradlex.extra-java-module-info' version '1.13.1'
}

group = 'com.bitcoinquantum'
version = '0.1.0'

repositories {
    mavenCentral()
}

java {
    disableAutoTargetJvm()
}

def qparrowSharedSources = objects.sourceDirectorySet('qparrowShared', 'Qparrow shared sources')
qparrowSharedSources.srcDir(rootProject.file('src/main/java'))
qparrowSharedSources.include 'com/sparrowwallet/sparrow/Qparrow*.java'
qparrowSharedSources.include 'com/sparrowwallet/sparrow/btq/**/*.java'

sourceSets {
    main {
        java {
            srcDirs = ['src/module']
            source(qparrowSharedSources)
        }
    }
}

javafx {
    version = '26'
    modules = ['javafx.controls', 'javafx.graphics']
}

dependencies {
    implementation('com.google.code.gson:gson:2.13.2')
    implementation('org.bouncycastle:bcprov-jdk18on:1.82')
    implementation('org.jcommander:jcommander:3.0')
    implementation('org.slf4j:slf4j-api:2.0.17')
    implementation('ch.qos.logback:logback-classic:1.5.21')
}

application {
    mainModule = 'com.bitcoinquantum.qparrow'
    mainClass = 'com.sparrowwallet.sparrow.QparrowLauncher'
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}

jlink {
    options = ['--strip-debug', '--compress', 'zip-6', '--no-header-files', '--no-man-pages',
               '--ignore-signing-information']
    launcher {
        name = 'qparrow'
    }
    jpackage {
        imageName = 'Qparrow'
        installerName = 'Qparrow'
        appVersion = System.getProperty('os.name', '').toLowerCase(java.util.Locale.ROOT).contains('mac')
                ? '1.0.0' : "${version}"
        skipInstaller = true
        installerOptions = ['--license-file', rootProject.file('LICENSE').absolutePath]
        imageOptions = []
        if(System.getProperty('os.name', '').toLowerCase(java.util.Locale.ROOT).contains('mac')) {
            imageOptions = ['--mac-package-identifier', 'com.bitcoinquantum.qparrow',
                            '--resource-dir', file('src/main/jpackage/macos').absolutePath]
        }
    }
}

def dependencyInventory = layout.buildDirectory.file('reports/qparrow-runtime-dependencies.txt')
tasks.register('qparrowDependencyInventory') {
    outputs.file(dependencyInventory)
    doLast {
        def output = dependencyInventory.get().asFile
        output.parentFile.mkdirs()
        output.text = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
                .collect { artifact -> "${artifact.moduleVersion.id.group}:${artifact.name}:${artifact.moduleVersion.id.version}" }
                .sort().unique().join(System.lineSeparator()) + System.lineSeparator()
    }
}

tasks.register('copyQparrowLegal', Copy) {
    dependsOn tasks.named('qparrowDependencyInventory')
    from(rootProject.file('LICENSE'))
    from(rootProject.file('NOTICE'))
    from(dependencyInventory) {
        rename { 'THIRD_PARTY_DEPENDENCIES.txt' }
    }
    into(System.getProperty('os.name', '').toLowerCase(java.util.Locale.ROOT).contains('mac')
            ? layout.buildDirectory.dir('jpackage/Qparrow.app/Contents/app/legal')
            : layout.buildDirectory.dir('jpackage/Qparrow/lib/app/legal'))
}

tasks.named('jpackageImage') {
    finalizedBy tasks.named('copyQparrowLegal')
}

tasks.register('verifyQparrowIsolation') {
    dependsOn tasks.named('jar')
    doLast {
        def entries = zipTree(tasks.named('jar').get().archiveFile.get().asFile).files
                .collect { it.path.replace('\\', '/') }
        def forbidden = entries.findAll { path ->
            path.endsWith('/SparrowWallet.class') || path.contains('/drongo/')
                    || path.endsWith('/AppController.class') || path.endsWith('/SparrowDesktop.class')
        }
        if(!forbidden.isEmpty()) {
            throw new GradleException("Qparrow artifact contains inherited wallet runtime classes: ${forbidden}")
        }
        def projectDependencies = configurations.runtimeClasspath.allDependencies
                .findAll { dependency -> dependency instanceof ProjectDependency }
        if(!projectDependencies.isEmpty()) {
            throw new GradleException("Qparrow runtime must not depend on Sparrow subprojects: ${projectDependencies}")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyQparrowIsolation')
}

extraJavaModuleInfo {
    module('org.jcommander:jcommander', 'org.jcommander') {
        exports('com.beust.jcommander')
    }
}
